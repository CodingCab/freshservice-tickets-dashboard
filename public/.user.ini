; Raised for the /api/agents (agent queue) endpoint, which builds the full
; in-range history as one array and json_encodes it. On high-volume days the
; 24h window alone is ~50MB of JSON / ~170MB peak, exceeding php.ini's 128M and
; making the endpoint return an empty 500 body ("Unexpected end of JSON input").
; See TicketsController::agents(). Durable fix is to cap/paginate that endpoint.
memory_limit = 1024M
